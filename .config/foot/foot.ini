[main]
# Dropped back to size 10, which looks best without DPI scaling
font=monospace:size=10

# Disable DPI scaling so it renders the exact same way on both 1080p screens
dpi-aware=no

# Keeps the breathing room from the edges
pad=8x8 

letter-spacing=1
box-drawings-uses-font-glyphs=yes

# Updated tag to fix the deprecation warning
[colors-dark]
background=000000
foreground=ffffff
