# The "Just the Essentials" Theme
format = "$directory$git_branch$character"

# Show current folder in Cyan
[directory]
style = "bold cyan"
truncation_length = 3

# Option A: Minimal Text (cleanest)
read_only = " RO"
# Option B: Remove it completely (leave empty)
# read_only = "" 

read_only_style = "bold red"

# The Prompt Character (Purple = Good, Red = Error)
[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"

# Minimal Git status (only shows if you are in a repo)
[git_branch]
format = "[$symbol$branch]($style) "
style = "bold yellow"
 
